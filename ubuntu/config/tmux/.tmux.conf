# UTF-8 / 256-color terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Vim의 모드별 커서 모양 제어 시퀀스를 터미널까지 전달합니다.
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[ q'

# tmux prefix: Ctrl+b → Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# 한글 입력과 화면 갱신
set -g history-limit 10000
set -sg escape-time 0
set -g focus-events on

# 마우스로 창 선택·분할 크기 조절·스크롤
set -g mouse on

# 창과 패널 번호를 알아보기 쉽게 표시
setw -g pane-base-index 1
set -g base-index 1
set -g renumber-windows on

# 검은 배경에서 잘 보이는 패널 테두리
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour117"

# 상태 표시줄
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour252"
set -g status-left-length 30
set -g status-left "#[fg=colour117,bold] #S #[default]"
set -g window-status-format " #[fg=colour245]#I:#W #[default]"
set -g window-status-current-format "#[fg=colour235,bg=colour117,bold] #I:#W #[default]"
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "

# 설정 다시 불러오기: Ctrl+Space r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
